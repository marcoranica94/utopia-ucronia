name: Verify and deploy the site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_access:
        description: Verify the Access configuration without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

# Secret and variable names (ACCESS_EMAIL_PROPRIETARIO, DEPLOY_ABILITATO,
# BACKUP_R2_ABILITATO) are kept as configured in the GitHub repository settings.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout with the LFS archive
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: pnpm
        uses: pnpm/action-setup@v6
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Script tests
        run: pnpm test
      - name: Style check
        run: pnpm lint
      - name: Integrity of the originals
        run: pnpm recovery verify
      - name: Conversion, types, build and links
        run: pnpm build
      - name: Keep the conversion report
        uses: actions/upload-artifact@v6
        with:
          name: conversion-report
          path: reports/conversion.json
          retention-days: 14
      - name: Verify Access before publishing
        if: github.event_name != 'pull_request' && (vars.DEPLOY_ABILITATO == 'true' || inputs.verify_access == true)
        run: pnpm deploy:verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_OWNER_EMAIL: ${{ secrets.ACCESS_EMAIL_PROPRIETARIO }}
      - name: Private deploy to Cloudflare
        if: github.event_name != 'pull_request' && vars.DEPLOY_ABILITATO == 'true'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Back up the originals to R2
        if: github.event_name != 'pull_request' && vars.BACKUP_R2_ABILITATO == 'true'
        run: pnpm backup --r2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy waiting for configuration
        if: github.event_name != 'pull_request' && vars.DEPLOY_ABILITATO != 'true'
        run: echo '::notice::Build verified. Configure Access, secrets and DEPLOY_ABILITATO before deploying.'
