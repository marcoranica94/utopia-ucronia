name: Verifica e deploy del sito

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verifica_access:
        description: Verifica la configurazione Access senza pubblicare
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sito-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout con archivio LFS
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: pnpm
        uses: pnpm/action-setup@v6
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Dipendenze bloccate
        run: pnpm install --frozen-lockfile
      - name: Test degli script
        run: pnpm test
      - name: Controllo stile
        run: pnpm lint
      - name: Integrità degli originali
        run: pnpm recupero verifica
      - name: Conversione, tipi, build e collegamenti
        run: pnpm build
      - name: Conserva i rapporti di conversione
        uses: actions/upload-artifact@v6
        with:
          name: rapporti-conversione
          path: rapporti/conversione.json
          retention-days: 14
      - name: Verifica Access prima di pubblicare
        if: github.event_name != 'pull_request' && (vars.DEPLOY_ABILITATO == 'true' || inputs.verifica_access == true)
        run: pnpm deploy:verifica
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_EMAIL_PROPRIETARIO: ${{ secrets.ACCESS_EMAIL_PROPRIETARIO }}
      - name: Deploy privato su Cloudflare
        if: github.event_name != 'pull_request' && vars.DEPLOY_ABILITATO == 'true'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Backup degli originali su R2
        if: github.event_name != 'pull_request' && vars.BACKUP_R2_ABILITATO == 'true'
        run: pnpm backup --r2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy in attesa della configurazione
        if: github.event_name != 'pull_request' && vars.DEPLOY_ABILITATO != 'true'
        run: echo '::notice::Build verificata. Configurare Access, segreti e DEPLOY_ABILITATO prima del deploy.'
